[tool.poetry]
name = "bitdata"
version = "0.1.0"
description = "Tools for analyzing data on Bitcoin and Lightning Network"
authors = ["waltermaffy <walterm21@proton.me>"]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
requests = "^2.33.0"
python-bitcoinrpc = "^1.0"
pandas = "^2.0.2"
loguru = "^0.7.0"
streamlit = "^1.66.1"
pydantic = {extras = ["dotenv"], version = "^1.10.8"}
plotly = "^5.14.1"
Pillow = "^13.0.0"
matplotlib = "^3.7.1"
tqdm = "^4.65.0"
python-telegram-bot = "^22.8"
python-dotenv = "^1.0.0"
discordwebhook = "^1.0.3"

# Security floors for transitive packages; keep the exported requirements in sync.
anyio = ">=4.14.2,<5"
certifi = ">=2026.10.19"
gitpython = ">=3.2.1,<4"
h11 = ">=0.16.0,<1"
idna = ">=3.15,<4"
jinja2 = ">=3.1.6,<4"
orjson = ">=3.11.6,<4"
protobuf = ">=6.33.5,<8"
pyarrow = ">=26.0.0,<27"
pygments = ">=2.19.2,<3"
tornado = ">=6.5.9,<7"
urllib3 = ">=2.8.0,<3"
zipp = ">=3.19.1,<4"

[tool.poetry.dev-dependencies]
mypy = "^0.971"
black = ">=26.10.1,<27"
isort = "^5.10.1"
pytest-cov = "^4.0.0"
pytest = ">=9.0.3,<10"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
